base_model: "Qwen/Qwen2.5-1.5B-Instruct"
teacher_model: "Qwen/Qwen2.5-7B-Instruct"
teacher_8bit: false

data:
  train_jsonl: "data/gkd_train.json"
  candidates_file: "data/gkd_candidates_1p5b.jsonl"
  max_length: 2048

gkd:
  kd_lambda: 0.5
  div_lambda: 0.1
  max_cands: 3
  use_jsd: true
  jsd_alpha: 0.9
  jsd_lambda: 0.5
  use_rkl: true
  rkl_lambda: 0.5
  temperature: 2.0

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: ["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"]

training:
  output_dir: "runs/gkd-1p5b-7b"
  resume_adapter: "runs/sft-1p5b"
  batch_size: 2
  grad_accum: 8
  epochs: 1
  lr: 1e-4
  warmup_ratio: 0.03
  logging_steps: 20
  save_steps: 1000
  report_to: "none"
  dtype: "bf16"
  load_in_4bit: true
  gradient_checkpointing: true
