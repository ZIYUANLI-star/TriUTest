base_model: "Qwen/Qwen2.5-7B-Instruct"
output_dir: "runs/sft-7b"
train_file: "data/sft_train.json"
add_domain_expansion: false
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: ["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"]
training:
  micro_batch_size: 4
  grad_acc_steps: 8
  epochs: 1
  lr: 2e-4
  warmup_ratio: 0.03
  max_len: 2048
  bf16: true
  use_4bit: true
